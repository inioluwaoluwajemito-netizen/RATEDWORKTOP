name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Assets (www folder)
      run: |
        rm -rf www
        mkdir -p www
        cp *.html www/ 2>/dev/null || true
        cp -r css www/ 2>/dev/null || true
        cp -r js www/ 2>/dev/null || true
        cp -r images www/ 2>/dev/null || true
        if [ -d "admin" ]; then
          mkdir -p www/admin
          cp admin/*.html www/admin/ 2>/dev/null || true
          cp -r admin/css www/admin/ 2>/dev/null || true
          cp -r admin/js www/admin/ 2>/dev/null || true
        fi

    - name: Make Gradle Wrapper Executable
      run: chmod +x android/gradlew

    - name: Copy Web Assets to Capacitor Android
      run: npx cap copy android

    - name: Build Android APK (Debug)
      working-directory: ./android
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ratedworktops-app
        path: android/app/build/outputs/apk/debug/app-debug.apk
