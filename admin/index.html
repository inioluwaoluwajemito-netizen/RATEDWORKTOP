<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Sign In — RatedWorktops</title>
  <meta name="description" content="RatedWorktops administrator portal login" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    /* Ensure auth page styling matches main app login.html exactly */
    body {
      background: var(--bg-primary);
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }

    .auth-bg {
      background-image: linear-gradient(rgba(9, 9, 15, 0.55), rgba(9, 9, 15, 0.85)), url('../images/login-bg.png');
    }
  </style>
</head>

<body>
  <div class="auth-bg"></div>
  <div class="auth-grid"></div>

  <div class="auth-page">
    <div class="auth-card fade-up">

      <div class="auth-logo">
        <a href="../index.html">
          <div class="logo-icon-lg">R</div>
        </a>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to access administrator portal</p>
      </div>

      <div class="auth-divider"></div>

      <!-- Google Sign-In -->
      <button type="button" class="google-btn" id="google-btn" onclick="googleSignIn()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        Continue with Google
      </button>

      <div class="or-divider">or sign in with email</div>

      <!-- Email Form -->
      <form id="login-form" novalidate>
        <div class="form-group" style="margin-bottom: 20px;">
          <label for="email"
            style="display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:8px">EMAIL
            ADDRESS</label>
          <div class="input-icon-wrap">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,12 2,6" />
            </svg>
            <input type="email" id="email" placeholder="you@example.com" value="ratedworktopsapp@gmail.com"
              autocomplete="email" required />
          </div>
          <div class="error-text" id="email-error" style="font-size:12px;color:var(--danger);margin-top:4px"></div>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <label for="password"
              style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:0">PASSWORD</label>
            <a href="#"
              onclick="alert('Admin Master Password: Ratedworktopsapp@\nOr sign in directly using ratedworktopsapp@gmail.com'); return false;"
              style="font-size:12px;color:var(--gold);font-weight:500">Forgot password?</a>
          </div>
          <div class="input-icon-wrap" style="position:relative">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0110 0v4" />
            </svg>
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required
              style="padding-right:44px" />
            <button type="button" class="show-pass-btn" id="toggle-pass"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer">
              <svg id="eye-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <div class="error-text" id="password-error" style="font-size:12px;color:var(--danger);margin-top:4px"></div>
        </div>

        <div id="error-msg"
          style="background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--danger);margin-bottom:16px;display:none">
        </div>

        <button type="submit" class="btn btn-primary w-full btn-lg" id="login-btn"
          style="justify-content:center;width:100%;height:48px;font-weight:700;font-size:15px">
          Sign In
        </button>
      </form>

      <div class="auth-footer-link" style="margin-top:20px;font-size:13px;color:var(--text-muted);text-align:center">
        Administrator Access Only
      </div>

      <div style="text-align:center;margin-top:16px">
        <a href="../index.html" style="font-size:12px;color:var(--text-muted);text-decoration:none">← Back to
          homepage</a>
      </div>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script src="js/admin.js"></script>
  <script>
    // Safe helper to get MockSupabaseClient from scope or window
    function getMockClient() {
      if (typeof window !== 'undefined' && typeof window.createMockSupabaseClient === 'function') {
        const inst = window.createMockSupabaseClient();
        if (inst) return inst;
      }
      if (typeof MockSupabaseClient !== 'undefined') return new MockSupabaseClient();
      if (typeof window !== 'undefined' && window.MockSupabaseClient) return new window.MockSupabaseClient();
      return null;
    }

    function goToAdminDashboard() {
      const origin = window.location.origin;
      const pathname = window.location.pathname;
      if (pathname.includes('/admin/')) {
        window.location.href = origin + pathname.substring(0, pathname.indexOf('/admin/') + 7) + 'dashboard.html';
      } else {
        window.location.href = origin + '/admin/dashboard.html';
      }
    }

    // Redirect if already logged in as admin
    document.addEventListener('DOMContentLoaded', async () => {
      let session = null;

      // 1. Check local/mock session FIRST (instant, no network)
      try {
        const mockClient = getMockClient();
        if (mockClient) {
          const { data } = await mockClient.auth.getSession();
          session = data ? data.session : null;
        }
      } catch (e) { }

      // 2. If no local session, try real Supabase with 1.5s timeout
      if (!session || !session.user) {
        try {
          const realPromise = supabaseClient.auth.getSession();
          const timeoutPromise = new Promise(resolve => setTimeout(() => resolve({ data: { session: null } }), 1500));
          const { data } = await Promise.race([realPromise, timeoutPromise]);
          session = data ? data.session : null;
        } catch (e) { }
      }

      if (session && session.user && session.user.email && session.user.email.toLowerCase().trim() === 'ratedworktopsapp@gmail.com') {
        goToAdminDashboard();
      }
    });

    // Toggle password visibility
    document.getElementById('toggle-pass').addEventListener('click', () => {
      const inp = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"/>`;
      } else {
        inp.type = 'password';
        icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
      }
    });

    // Login form
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error-msg');
      const btn = document.getElementById('login-btn');

      document.getElementById('email-error').textContent = '';
      document.getElementById('password-error').textContent = '';
      errEl.style.display = 'none';

      if (!email) { document.getElementById('email-error').textContent = 'Please enter your email.'; return; }
      if (!password) { document.getElementById('password-error').textContent = 'Please enter your password.'; return; }

      if (email.toLowerCase() !== 'ratedworktopsapp@gmail.com') {
        errEl.textContent = 'Unauthorized email address. Only Administrator accounts can log in here.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      let loginSuccess = false;
      let loginError = null;

      // 1. Try Local/Mock Admin authentication FIRST — this is instant & never hangs
      try {
        const mockClient = getMockClient();
        if (mockClient) {
          const { data, error } = await mockClient.auth.signInWithPassword({ email, password });
          if (!error && data && data.session) {
            loginSuccess = true;
          } else if (error) {
            loginError = error.message;
          }
        } else {
          // If no mock client available, fallback to matching ADMIN_CREDENTIALS directly
          if (password === 'Ratedworktopsapp@') {
            const adminUser = { id: 999, email: 'ratedworktopsapp@gmail.com', name: 'Site Administrator' };
            const session = { user: adminUser, access_token: 'mock-token-999', expires_at: Math.floor(Date.now() / 1000) + 3600 };
            localStorage.setItem('rw_session', JSON.stringify(session));
            loginSuccess = true;
          } else {
            loginError = 'Invalid login credentials';
          }
        }
      } catch (err) {
        loginError = err.message || String(err);
      }

      // 2. Only try real Supabase if local auth failed (background, non-blocking)
      if (!loginSuccess && typeof supabaseClient !== 'undefined' && supabaseClient) {
        try {
          const controller = new AbortController();
          const tid = setTimeout(() => controller.abort(), 2000);
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          clearTimeout(tid);
          if (!error && data && data.session) {
            loginSuccess = true;
            loginError = null;
          } else if (error && !loginError) {
            loginError = error.message;
          }
        } catch (err) {
          // Supabase timed out or failed — no problem, local auth result stands
        }
      }

      if (loginSuccess) {
        goToAdminDashboard();
      } else {
        errEl.textContent = loginError || 'Invalid login credentials';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    // Google Sign-In for Admin
    async function googleSignIn() {
      const btn = document.getElementById('google-btn');
      btn.disabled = true;
      btn.innerHTML = `Connecting to Google...`;

      let success = false;
      try {
        if (typeof supabaseClient !== 'undefined' && supabaseClient) {
          const { data, error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: window.location.origin + '/admin/dashboard.html',
              queryParams: {
                prompt: 'select_account',
                access_type: 'offline'
              }
            }
          });
          if (!error && data) {
            success = true;
          }
        }
      } catch (err) { }

      if (!success) {
        try {
          const mockClient = getMockClient();
          if (mockClient) {
            await mockClient.auth.signInWithOAuth({
              provider: 'google',
              options: {
                redirectTo: 'dashboard.html'
              }
            });
            success = true;
          }
        } catch (err) { }
      }

      if (success) {
        goToAdminDashboard();
      } else {
        btn.disabled = false;
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google`;
      }
    }
  </script>
</body>

</html>
